<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video 1000</title>
    
    <!-- Code giúp hiển thị Logo trên Cả Web và Màn hình chính iPhone -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-title" content="Video 1000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginScreen" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="mb-4 drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">
            <img src="logo.png" alt="Logo Video 1000" class="w-32 h-32 object-contain">
        </div>
        <h1 class="text-4xl font-bold mb-8 tracking-wider text-red-500">VIDEO 1000</h1>
        
        <div class="w-full max-w-sm bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <input type="tel" id="phone" placeholder="Số điện thoại" class="w-full mb-4 px-4 py-3 bg-gray-700 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
            <input type="password" id="password" placeholder="Mật khẩu" class="w-full mb-6 px-4 py-3 bg-gray-700 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
            <button onclick="login()" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold transition duration-300 shadow-lg shadow-red-500/50">ĐĂNG NHẬP</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (DASHBOARD) -->
    <div id="dashboard" class="hidden min-h-screen flex-col">
        <header class="bg-gray-800 p-4 flex justify-between items-center shadow-md border-b border-gray-700">
            <div class="flex items-center gap-3 font-bold text-lg text-red-500">
                <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain"> 
                Video 1000
            </div>
            <div class="flex gap-4 items-center">
                <span class="text-yellow-400 font-bold bg-gray-700 px-3 py-1 rounded-full shadow-inner">
                    <i class="fa-solid fa-coins"></i> <span id="creditScore">...</span>
                </span>
                <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-xl"><i class="fa-solid fa-sign-out-alt"></i></button>
            </div>
        </header>

        <div class="flex bg-gray-800 shadow-md">
            <button onclick="switchTab('tabUpload')" id="btnTabUpload" class="flex-1 py-4 text-red-500 font-bold border-b-2 border-red-500 transition duration-300">🚀 LÊN CAM</button>
            <button onclick="switchTab('tabEarn')" id="btnTabEarn" class="flex-1 py-4 text-gray-400 font-bold border-b-2 border-transparent transition duration-300">🤝 KIẾM ĐIỂM</button>
        </div>

        <!-- TAB LÊN CAM -->
        <div id="tabUpload" class="p-6 flex-1 bg-gray-900">
            <div class="bg-gray-800 p-5 rounded-xl text-center shadow-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-2 text-red-400">Nhiệm vụ hôm nay</h2>
                <p class="text-gray-400 text-sm mb-6">Mỗi lượt hoàn thành trừ 2 điểm. Tải 1 chạm!</p>
                
                <div class="flex gap-4 mb-4">
                    <button onclick="downloadVideo()" class="flex-1 bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold flex flex-col items-center justify-center gap-1 transition shadow-lg shadow-green-500/30">
                        <i class="fa-solid fa-download text-xl"></i> Tải Video
                    </button>
                    <button onclick="copyCaption()" class="flex-1 bg-gray-600 hover:bg-gray-500 py-3 rounded-lg font-bold flex flex-col items-center justify-center gap-1 transition shadow-lg">
                        <i class="fa-solid fa-copy text-xl"></i> Copy Nội dung
                    </button>
                </div>

                <div class="mt-8 text-left border-t border-gray-700 pt-6">
                    <label class="text-sm font-semibold text-gray-300">Nộp Link Facebook Reels đã đăng:</label>
                    <input type="url" id="linkFB" placeholder="https://www.facebook.com/reel/..." class="w-full mt-2 mb-4 px-4 py-3 bg-gray-700 rounded focus:ring-2 focus:ring-red-500 outline-none">
                    <button onclick="confirmTask()" class="w-full bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold shadow-lg shadow-red-500/30 transition">
                        ✅ Xác nhận Đã Đăng & Xóa
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB KIẾM ĐIỂM -->
        <div id="tabEarn" class="hidden p-6 flex-1 bg-gray-900">
            <div class="bg-gray-800 p-5 rounded-xl text-center shadow-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-2 text-pink-400">Tương tác đồng đội</h2>
                <p class="text-gray-400 text-sm mb-6">Xem >20s và Comment có tâm để nhận +2 điểm.</p>
                
                <button onclick="openTeammateVideo()" class="w-full border-2 border-red-500 text-red-400 py-4 rounded-lg font-bold mb-6 hover:bg-red-900/30 transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-facebook text-xl"></i> Mở Video Của Đồng Đội
                </button>
                
                <button id="btnConfirmComment" onclick="confirmEarn()" class="w-full bg-gray-700 text-gray-500 py-4 rounded-lg font-bold cursor-not-allowed transition duration-500" disabled>
                    <i class="fa-solid fa-heart"></i> Đã Xem & Comment (Chờ 20s)
                </button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // ANH DÁN LINK GOOGLE APPS SCRIPT CỦA ANH VÀO ĐÂY:
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzaXl3sQHI_aULsCAhtbwWzOCg1mcXW1Ca3C2_7T4451M0EcB7lUgRqEbWVBTP9k1uq/exec"; 
        // =====================================================================

        let currentPhone = localStorage.getItem("video1000_phone");
        let currentTask = null; 

        window.onload = () => {
            if(currentPhone) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('flex');
                document.getElementById('creditScore').innerText = localStorage.getItem("video1000_credit") || "0";
                
                loadRealTask(); 
            }
        };

        // Hàm Đăng Nhập thật
        function login() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;
            
            if(!phone || !pass) return Swal.fire("Lỗi", "Vui lòng nhập số điện thoại và mật khẩu", "warning");

            Swal.fire({ title: 'Đang kiểm tra...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", phone: phone, pass: pass })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem("video1000_phone", phone);
                    localStorage.setItem("video1000_credit", data.credit); 
                    window.location.reload();
                } else {
                    Swal.fire("Truy cập từ chối", data.msg, "error"); // Sai pass bị văng
                }
            })
            .catch(err => Swal.fire("Lỗi Kết Nối", "Vui lòng kiểm tra lại mạng hoặc link GAS.", "error"));
        }

        function loadRealTask() {
            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getTask" })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    currentTask = data.data; 
                } else {
                    Swal.fire("Thông báo", data.msg || "Hôm nay đã hết video nhiệm vụ!", "info");
                    document.getElementById('btnTabUpload').disabled = true; 
                }
            })
            .catch(err => console.log("Lỗi tải nhiệm vụ", err));
        }

        function logout() {
            localStorage.removeItem("video1000_phone");
            localStorage.removeItem("video1000_credit");
            window.location.reload();
        }

        function switchTab(tabId) {
            document.getElementById('tabUpload').classList.add('hidden');
            document.getElementById('tabEarn').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');
            
            document.getElementById('btnTabUpload').className = "flex-1 py-4 font-bold text-gray-400 border-b-2 border-transparent transition duration-300";
            document.getElementById('btnTabEarn').className = "flex-1 py-4 font-bold text-gray-400 border-b-2 border-transparent transition duration-300";
            
            document.getElementById(tabId === 'tabUpload' ? 'btnTabUpload' : 'btnTabEarn').className = "flex-1 py-4 font-bold text-red-500 border-b-2 border-red-500 transition duration-300";
        }

        function downloadVideo() {
            if(!currentTask) return Swal.fire("Khoan đã", "Đang tải dữ liệu từ kho hoặc đã hết video!", "warning");
            
            window.open(currentTask.linkR2, '_blank');
            Swal.fire({
                title: "Đã mở Video!",
                html: "Để lưu thẳng vào Album Ảnh:<br><br><b>Nhấn giữ 2 giây</b> vào video (hoặc bấm nút Chia sẻ) -> Chọn <b>Lưu Video</b> 📥",
                icon: "info",
                confirmButtonColor: '#dc2626',
                confirmButtonText: 'Đã hiểu'
            });
        }

        function copyCaption() {
            if(!currentTask) return Swal.fire("Khoan đã", "Chưa có nội dung!", "warning");
            
            navigator.clipboard.writeText(currentTask.caption);
            Swal.fire({ title: "Đã Copy", text: "Nội dung đã được lưu vào bộ nhớ tạm", icon: "success", timer: 1500, showConfirmButton: false });
        }

        function confirmTask() {
            if(!currentTask) return;
            const linkFB = document.getElementById('linkFB').value;
            if(!linkFB.includes("facebook.com")) {
                return Swal.fire("Lỗi Link", "Vui lòng nhập đúng link Facebook Reels", "warning");
            }
            
            Swal.fire({
                title: 'Đang nộp bài...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "submitTask",
                    phone: currentPhone,
                    linkFB: linkFB,
                    videoID: currentTask.videoID,
                    linkR2: currentTask.linkR2
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem("video1000_credit", data.newCredit);
                    document.getElementById('creditScore').innerText = data.newCredit;
                    document.getElementById('linkFB').value = '';
                    Swal.fire("Hoàn tất!", "Đã trừ 2 điểm và dọn dẹp không gian.", "success");
                    
                    currentTask = null;
                    loadRealTask();
                } else {
                    Swal.fire("Lỗi", "Không thể nộp bài", "error");
                }
            });
        }

        function openTeammateVideo() {
            window.open("https://www.facebook.com/watch", "_blank");
            let timeLeft = 20;
            let btn = document.getElementById('btnConfirmComment');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Vui lòng tương tác, chờ ${timeLeft}s...`;
            
            let timer = setInterval(() => {
                timeLeft--;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Vui lòng tương tác, chờ ${timeLeft}s...`;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.className = "w-full bg-pink-600 hover:bg-pink-500 text-white py-4 rounded-lg font-bold shadow-lg shadow-pink-500/50 transition cursor-pointer";
                    btn.innerHTML = `<i class="fa-solid fa-gift"></i> Đã Xem & Comment (+2 Điểm)`;
                }
            }, 1000);
        }

        function confirmEarn() {
            Swal.fire({ title: 'Đang cộng điểm...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "earnCredit", phone: currentPhone })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem("video1000_credit", data.newCredit);
                    document.getElementById('creditScore').innerText = data.newCredit;
                    
                    let btn = document.getElementById('btnConfirmComment');
                    btn.disabled = true;
                    btn.className = "w-full bg-gray-700 text-gray-500 py-4 rounded-lg font-bold cursor-not-allowed transition duration-500";
                    btn.innerHTML = `<i class="fa-solid fa-heart"></i> Đã Xem & Comment (Chờ 20s)`;
                    
                    Swal.fire("+2 Điểm", "Cảm ơn bạn đã tương tác giúp đồng đội lên xu hướng!", "success");
                }
            });
        }
    </script>
</body>
</html>
